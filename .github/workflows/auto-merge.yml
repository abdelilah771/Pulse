name: Auto Merge dev → main

on:
  # Triggered when the CI/CD Pipeline workflow completes
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches: [ "dev" ]

jobs:
  auto_merge:
    # Only run if CI succeeded AND it was triggered by a push to dev
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'dev' }}
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Configure Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Merge dev into main
      run: |
        git fetch origin main dev
        git checkout main
        git merge origin/dev --no-edit
        git push origin main

    - name: Notify success
      if: success()
      run: echo "✅ dev has been automatically merged into main after a successful CI pipeline."

    - name: Notify failure
      if: failure()
      run: echo "❌ Auto-merge failed. Please resolve conflicts manually."
